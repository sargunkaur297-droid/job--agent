name: Manual job scan

on:
  workflow_dispatch: {}

# This public repository must never store personal job history in a Git branch or Actions cache.
# Runs are manual until a private persistent database is configured.
permissions:
  contents: read
  issues: write

concurrency: job-agent

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run pipeline (temporary database; no personal data is committed)
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
        run: python -m app.run_daily
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Job Agent run failed" \
            --body "The manual job scan failed. Check the Actions run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
